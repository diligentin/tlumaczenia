<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">
<title>r✦⏖✦</title>

<style>
@font-face { font-family: "figtree"; src: url("https://tajnachalupka.github.io/main/Figtree.ttf"); }

body { margin: 0; background: #191818; font-family: figtree; }

#comic-container { max-width: 720px; margin: 0 auto; }

img.comic-page {
  width: 100%; display: block;
  opacity: 0; transition: opacity .25s ease;
  min-height: 400px;      /* ← DODANE */
  background: #111;       /* ← DODANE (opcjonalne, ale ładne) */
}

/* NAV BUTTONS */
.nav-buttons {
  position: fixed; bottom: 20px; left: 20px;
  display: flex; flex-direction: column;
  opacity: 1; transition: opacity .15s ease;
}
.nav-buttons.hidden { opacity: 0; pointer-events: none; }

.nav-btn {
  width: 60px; height: 60px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.btn-icon { width: 42px; filter: invert(1); }

/* COMMENTS */
#comments_title {
  color: white; font-size: 22px;
  text-align: center; margin-top: 30px;
  opacity: 0; transition: opacity .3s ease;
}

/* PADLET */
#padlet_box {
  padding: 10px; background: #191818;
  visibility: hidden; opacity: 0;
  transition: opacity .1s ease;
}
#padlet_loading, #chapter_loading {
  color: white; text-align: center; padding: 20px;
}

@media (max-width: 600px) { #padlet_box iframe { height: 635px !important; } }
@media (min-width: 601px) and (max-width: 1024px) { #padlet_box iframe { height: 960px !important; } }
</style>
</head>

<body>

<!-- HEADER PNG -->
<div id="series-header" style="
  position: fixed; top: 7px; left: 50%; transform: translateX(-50%);
  z-index: 9999; opacity: 1; transition: opacity .15s ease;">
  <a id="series-link" href="#"><img id="series-img" src="" style="max-height:30px; width:auto;"></a>
</div>

<div id="comic-container"></div>
<p id="chapter_loading" style="margin-top:40px;">Ładuję rozdział...</p>

<!-- BUTTONS -->
<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="nextBtn"><img src="https://tajnachalupka.github.io/main/szczala-next.png" class="btn-icon"></div>
  <div class="nav-btn" id="prevBtn"><img src="https://tajnachalupka.github.io/main/szczala-prev.png" class="btn-icon"></div>
  <div class="nav-btn" id="homeBtn"><img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon"></div>
</div>

<p id="comments_title">Komentarze</p>
<p id="padlet_loading" style="margin-top:40px;">Ładuję komentarze...</p>
<div id="padlet_box"></div>

<script>
(async function () {

  const qs = new URLSearchParams(location.search);
  const comicKey = qs.get("comic");
  const chapter = qs.get("chapter");
  const container = document.getElementById("comic-container");

  const nextBtn = document.getElementById("nextBtn");
  const prevBtn = document.getElementById("prevBtn");
  const homeBtn = document.getElementById("homeBtn");
  const nav = document.getElementById("nav");
  const header = document.getElementById("series-header");

  if (!comicKey || !chapter) return;

  /* DEVICE CHECK */
  const USE_SLICER = (() => {
    const ua = navigator.userAgent || "";
    if (/Android [0-8]\./i.test(ua)) return false;

    const t0 = performance.now();
    for (let i = 0; i < 40000; i++) {}
    if (performance.now() - t0 > 10) return false;

    try { return !!document.createElement("canvas").getContext("2d"); }
    catch { return false; }
  })();

  /* SLICER */
  const sliceImage = (src, h = 1800) => new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = src;

    img.onload = () => {
      if (!img.width) return reject();
      const slices = [];
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d");

      for (let y = 0; y < img.height; y += h) {
        const sh = Math.min(h, img.height - y);
        c.width = img.width; c.height = sh;
        ctx.drawImage(img, 0, y, img.width, sh, 0, 0, img.width, sh);
        slices.push(c.toDataURL("image/jpeg", 0.95));
      }
      resolve(slices);
    };

    img.onerror = reject;
  });

  /* LOAD JSON */
  let data;
  try {
    data = await fetch(`${comicKey}.json`).then(r => r.json());
    if (data.series_icon) document.getElementById("series-img").src = data.series_icon;
    document.getElementById("series-link").href = `series.html?comic=${comicKey}`;
  } catch {
    container.innerHTML = "<p style='color:white;text-align:center;padding:50px;'>Błąd JSON.</p>";
    return;
  }

  const pages = data.chapters[chapter];
  if (!pages) return;

  localStorage.setItem(`read_${comicKey}_${chapter}`, "1");

  /* LAZY OBSERVER */
  const lazyObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const img = e.target;
      if (e.isIntersecting && img.dataset.src) {
        img.src = img.dataset.src;
        img.dataset.src = "";
        img.style.opacity = "1";
        const loading = document.getElementById("chapter_loading");
        if (loading) loading.remove();
      }
    });
  }, { rootMargin: "1200px 0px" });

  /* INSERT IMAGES */
  let first = true;

  for (const src of pages) {
    try {
      const list = USE_SLICER ? await sliceImage(src) : [src];

      for (const s of list) {
        const img = document.createElement("img");
        img.className = "comic-page";

        if (first) {
          img.src = s;
          img.style.opacity = "1";
          first = false;
        } else {
          img.dataset.src = s;
          img.loading = "lazy";
          lazyObserver.observe(img);
        }

        container.appendChild(img);
      }

    } catch {
      container.innerHTML += "<p style='color:red;text-align:center;'>Błąd obrazu.</p>";
    }
  }

  /* SORT CHAPTERS */
  const keys = Object.keys(data.chapters).sort((a, b) => {
    const na = +a, nb = +b;
    return (!isNaN(na) && !isNaN(nb)) ? na - nb : a.localeCompare(b);
  });

  const idx = keys.indexOf(chapter);

  /* BUTTONS */
  nextBtn.onclick = () =>
    location.href = idx < keys.length - 1
      ? `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[idx + 1])}`
      : "https://diligentin.github.io/tlumaczenia/";

  prevBtn.onclick = () =>
    location.href = idx > 0
      ? `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[idx - 1])}`
      : "https://diligentin.github.io/tlumaczenia/";

  homeBtn.onclick = () => location.href = "https://diligentin.github.io/tlumaczenia/";

  /* PADLET */
  let padletLoaded = false;

  const loadPadlet = () => {
    if (padletLoaded) return;
    padletLoaded = true;

    const loading = document.getElementById("padlet_loading");
    if (loading) loading.remove();

    document.getElementById("comments_title").style.opacity = "1";

    const box = document.getElementById("padlet_box");
    const embed = data.padlet;
    const full = embed.replace("/embed/", "/");

    box.innerHTML = `
      <div style="border:1px solid #0001; border-radius:2px; overflow:hidden; max-width:720px; margin:0 auto;">
        <iframe src="${embed}" frameborder="0" style="width:100%;height:600px;"></iframe>
        <p style="text-align:center; margin-top:14px;">
          <a href="${full}" target="_blank"
             style="padding:10px 18px; background:#272727; color:white; font-size:14px; border-radius:3px; text-decoration:none;">
            Otwórz padlet
          </a>
        </p>
      </div>
    `;

    box.style.visibility = "visible";
    box.style.opacity = "1";
  };

  new IntersectionObserver(e => e[0].isIntersecting && loadPadlet(), { threshold: 0.1 })
    .observe(document.getElementById("padlet_box"));

  window.addEventListener("scroll", function reveal() {
    if (window.scrollY > 250) {
      const box = document.getElementById("padlet_box");
      box.style.visibility = "visible";
      box.style.opacity = "1";
      window.removeEventListener("scroll", reveal);
    }
  });

  /* ⭐ AUTO‑HIDE BUTTONS — NATYCHMIASTOWE, PROSTE, NIEZAWODNE ⭐ */
  let lastScroll = 0;

  window.addEventListener("scroll", () => {
    const current = window.scrollY;

    if (current > lastScroll) {
      nav.classList.add("hidden");
      header.style.opacity = "0";
    } else {
      nav.classList.remove("hidden");
      header.style.opacity = "1";
    }

    lastScroll = current;
  }, { passive: true });

})();
</script>

</body>
</html>
