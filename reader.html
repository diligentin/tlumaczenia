<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">

<title>✦⏖✦</title>

<style>
@font-face {
  font-family: "figtree";
  src: url("https://tajnachalupka.github.io/main/Figtree.ttf");
}

body {
  margin: 0;
  background: #191818;
}

#comic-container {
  max-width: 720px;
  margin: 0 auto;
}

img.comic-page {
  width: 100%;
  height: auto;
  display: block;
  opacity: 0;
  transition: opacity .25s ease;
}

/* ===== FLOATING BUTTONS ===== */
.nav-buttons {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  flex-direction: column;
  gap: 0px;
  transition: opacity .15s ease;
  opacity: 1;
}

.nav-buttons.hidden {
  opacity: 0;
  pointer-events: none;
}

.nav-btn {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.btn-icon {
  width: 42px;
  height: 42px;
  filter: invert(1);
}

/* ===== KOMENTARZE — NAGŁÓWEK ===== */
#comments_title {
  color: white;
  font-family: figtree;
  font-size: 22px;
  text-align: center;
  margin-top: 30px;
  opacity: 0;
  transition: opacity .3s ease;
}

/* ===== PADLET ===== */
#padlet_box {
  padding: 10px;
  background: #191818;
  margin-top: 0px;
  visibility: hidden;
  opacity: 0;
  transition: opacity .1s ease;
}

#padlet_loading, #chapter_loading {
  color: white;
  text-align: center;
  font-family: figtree;
  padding: 20px;
}
</style>
</head>

<body>

<div id="comic-container"></div>

<p id="chapter_loading">Ładuję rozdział...</p>

<!-- BUTTONS -->
<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="nextBtn"><img src="https://tajnachalupka.github.io/main/szczala-next.png" class="btn-icon"></div>
  <div class="nav-btn" id="prevBtn"><img src="https://tajnachalupka.github.io/main/szczala-prev.png" class="btn-icon"></div>
  <div class="nav-btn" id="homeBtn"><img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon"></div>
</div>

<p id="comments_title">Komentarze</p>

<p id="padlet_loading">Ładuję komentarze...</p>
<div id="padlet_box"></div>

<script>
(async function () {

  const params = new URLSearchParams(location.search);
  const comicKey = params.get("comic");
  const chapter = params.get("chapter");
  const container = document.getElementById("comic-container");

  if (!comicKey || !chapter) return;

  /* ===== FALLBACK ===== */
  function isOldDevice() {
    const ua = navigator.userAgent || "";
    const oldAndroid = /Android [0-8]\./i.test(ua);

    let slowCPU = false;
    const t0 = performance.now();
    for (let i = 0; i < 40000; i++) {}
    if (performance.now() - t0 > 10) slowCPU = true;

    let badCanvas = false;
    try {
      const c = document.createElement("canvas");
      if (!c.getContext("2d")) badCanvas = true;
    } catch { badCanvas = true; }

    return oldAndroid || slowCPU || badCanvas;
  }

  const USE_SLICER = !isOldDevice();

  /* ===== SLICER ===== */
  async function sliceImage(src, sliceHeight = 1800) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = src;

      img.onload = () => {
        const slices = [];
        const scale = 720 / img.width;
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        for (let y = 0; y < img.height; y += sliceHeight) {
          const h = Math.min(sliceHeight, img.height - y);
          canvas.width = 720;
          canvas.height = h * scale;
          ctx.drawImage(img, 0, y, img.width, h, 0, 0, canvas.width, canvas.height);
          slices.push(canvas.toDataURL("image/jpeg", 0.9));
        }
        resolve(slices);
      };

      img.onerror = reject;
    });
  }

  /* ===== JSON ===== */
  let data;
  try {
    data = await fetch(`${comicKey}.json`).then(r => r.json());
  } catch {
    container.innerHTML = "<p style='color:white;text-align:center;padding:50px;'>Błąd JSON.</p>";
    return;
  }

  const pages = data.chapters[chapter];
  if (!pages) return;

  localStorage.setItem(`read_${comicKey}_${chapter}`, "1");

  /* ===== LAZY + FADE-IN ===== */
  const lazyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const img = entry.target;
      if (entry.isIntersecting) {
        if (img.dataset.src) {
          img.src = img.dataset.src;
          img.dataset.src = "";
        }
        img.style.opacity = "1";

        const loadingChapter = document.getElementById("chapter_loading");
        if (loadingChapter) loadingChapter.remove();
      }
    });
  }, { rootMargin: "1200px 0px" });

  /* ===== WSTAWIANIE OBRAZÓW ===== */
  for (const src of pages) {
    try {
      if (USE_SLICER) {
        const slices = await sliceImage(src);
        for (const s of slices) {
          const img = document.createElement("img");
          img.className = "comic-page";
          img.dataset.src = s;
          img.loading = "lazy";
          img.decoding = "async";
          container.appendChild(img);
          lazyObserver.observe(img);
        }
      } else {
        const img = document.createElement("img");
        img.className = "comic-page";
        img.dataset.src = src;
        img.loading = "lazy";
        img.decoding = "async";
        container.appendChild(img);
        lazyObserver.observe(img);
      }
    } catch {
      container.innerHTML += "<p style='color:red;text-align:center;'>Błąd obrazu.</p>";
    }
  }

  /* ===== SORTOWANIE ===== */
  const keys = Object.keys(data.chapters).sort((a, b) => {
    const na = parseInt(a), nb = parseInt(b);
    const ha = !isNaN(na), hb = !isNaN(nb);
    if (ha && hb) return na - nb || a.localeCompare(b);
    if (ha) return -1;
    if (hb) return 1;
    return a.localeCompare(b);
  });

  const index = keys.indexOf(chapter);

  /* ===== BUTTONS ===== */
  nextBtn.onclick = () => {
    if (index < keys.length - 1)
      location.href = `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index + 1])}`;
    else location.href = "https://diligentin.github.io/tlumaczenia/";
  };

  prevBtn.onclick = () => {
    if (index > 0)
      location.href = `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index - 1])}`;
    else location.href = "https://diligentin.github.io/tlumaczenia/";
  };

  homeBtn.onclick = () => location.href = "https://diligentin.github.io/tlumaczenia/";

  /* ===== PADLET MAPA ===== */
  const padletMap = {
    "afos": "https://padlet.com/vvvvvvvvvvvvvvvv/padlet-xvfowvg6hnywhy1s",
    "at":   "https://padlet.com/vvvvvvvvvvvvvvvv/padlet-m2x098yvh45m5ggj",
    "bn":   "https://padlet.com/vvvvvvvvvvvvvvvv/padlet-wuvnm169lfl7o6eq",
    "mp": "https://padlet.com/vvvvvvvvvvvvvvvvv/melting-point-o5kcvpcptb5itui1",
    "mo":   "https://padlet.com/vvvvvvvvvvvvvvvvv/moze-ognia-cx6d1o9objsqbrey",
    "mnbig":   "https://padlet.com/vvvvvvvvvvvvvvvvv/my-new-boss-is-goofy-6hpej4ulkkn1qhiv",
    "1rta": "https://padlet.com/vvvvvvvvvvvvvvvvvv/one-room-ta-i4dpk9rl9n62kku4",
    "osd":   "https://padlet.com/vvvvvvvvvvvvvvvvvv/our-sunny-days-a3k90ueey9qztdri",
    "rc":   "https://padlet.com/vvvvvvvvvvvvvvvvvv/rainbow-city-fwvlaiawvad7ugrc",
    "sah": "https://padlet.com/vvvvvvvvvvvvvvvvvvv/sahan-fyxbs54jbh7nqvk4",
    "ub":   "https://padlet.com/vvvvvvvvvvvvvvvvvvv/uwaga-bestia-o0plra2tzpi96h76",
    "yiam":   "https://padlet.com/vvvvvvvvvvvvvvvvvvv/yang-ilwoo-and-me-7r525d9si7ca6l7c"
  };

  /* ===== PADLET LAZY LOAD ===== */
  let padletLoaded = false;

  function loadPadlet() {
    if (padletLoaded) return;
    padletLoaded = true;

    const loadingMsg = document.getElementById("padlet_loading");
    if (loadingMsg) loadingMsg.remove();

    const title = document.getElementById("comments_title");
    title.style.opacity = "1";

    const padletBox = document.getElementById("padlet_box");
    const url = padletMap[comicKey];

    padletBox.innerHTML = `
      <div style="
        border:1px solid rgba(0,0,0,0.1);
        border-radius:2px;
        overflow:hidden;
        width:100%;
        max-width:720px;
        margin:0 auto;
        background:#191818;
      ">
        <iframe src="${url}" frameborder="0"
          style="width:100%;height:630px;display:block;">
        </iframe>
      </div>
    `;

    padletBox.style.visibility = "visible";
    padletBox.style.opacity = "1";
  }

  /* ===== OBSERWATOR PADLETU ===== */
  const padletEl = document.getElementById("padlet_box");

  const observerPadlet = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) loadPadlet();
  }, { threshold: 0.1 });

  observerPadlet.observe(padletEl);

  /* ===== POKAŻ PADLET PO 250 PX ===== */
  function revealExtras() {
    if (window.scrollY > 250) {
      padletEl.style.visibility = "visible";
      padletEl.style.opacity = "1";
      window.removeEventListener("scroll", revealExtras);
    }
  }

  window.addEventListener("scroll", revealExtras);

  setTimeout(() => {
    if (window.scrollY > 250) revealExtras();
  }, 50);

  /* ===== ZNIKANIE NAWIGACJI — SCROLL DOWN/UP ===== */
  const nav = document.getElementById("nav");
  let lastScroll = window.scrollY;

  window.addEventListener("scroll", () => {
    const current = window.scrollY;

    if (current > lastScroll) {
      nav.classList.add("hidden");   // scroll w dół → ukryj
    } else {
      nav.classList.remove("hidden"); // scroll w górę → pokaż
    }

    lastScroll = current;
  });

})();
</script>

</body>
</html>
