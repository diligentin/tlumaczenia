<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">
<title>..✦⏖✦</title>

<style>
@font-face { font-family: "figtree"; src: url("https://tajnachalupka.github.io/main/Figtree.ttf"); }

body { margin: 0; background: #191818; }

#comic-container { max-width: 720px; margin: 0 auto; }

img.comic-page {
  width: 100%; display: block;
  opacity: 0; transition: opacity .25s ease;
}

/* NAV BUTTONS */
.nav-buttons {
  position: fixed; bottom: 20px; left: 20px;
  display: flex; flex-direction: column;
  opacity: 1; transition: opacity .15s ease;
}
.nav-buttons.hidden { opacity: 0; pointer-events: none; }

.nav-btn {
  width: 60px; height: 60px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.btn-icon { width: 42px; filter: invert(1); }

/* COMMENTS */
#comments_title {
  color: white; font-family: figtree;
  font-size: 22px; text-align: center;
  margin-top: 30px; opacity: 0;
  transition: opacity .3s ease;
}

/* PADLET */
#padlet_box {
  padding: 10px; background: #191818;
  visibility: hidden; opacity: 0;
  transition: opacity .1s ease;
}
#padlet_loading, #chapter_loading {
  color: white; text-align: center;
  font-family: figtree; padding: 20px;
}

@media (max-width: 600px) { #padlet_box iframe { height: 635px !important; } }
@media (min-width: 601px) and (max-width: 1024px) { #padlet_box iframe { height: 960px !important; } }
</style>
</head>

<body>

<!-- HEADER PNG -->
<div id="series-header" style="
  position: fixed; top: 7px; left: 50%; transform: translateX(-50%);
  z-index: 9999; opacity: 1; transition: opacity .15s ease;">
  <a id="series-link" href="#"><img id="series-img" src="" style="max-height:30px; width:auto;"></a>
</div>

<div id="comic-container"></div>
<p id="chapter_loading" style="margin-top:40px;">Ładuję rozdział...</p>

<!-- BUTTONS -->
<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="nextBtn"><img src="https://tajnachalupka.github.io/main/szczala-next.png" class="btn-icon"></div>
  <div class="nav-btn" id="prevBtn"><img src="https://tajnachalupka.github.io/main/szczala-prev.png" class="btn-icon"></div>
  <div class="nav-btn" id="homeBtn"><img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon"></div>
</div>

<p id="comments_title">Komentarze</p>
<p id="padlet_loading" style="margin-top:40px;">Ładuję komentarze...</p>
<div id="padlet_box"></div>

<script>
(async function () {

  const params = new URLSearchParams(location.search);
  const comicKey = params.get("comic");
  const chapter = params.get("chapter");
  const container = document.getElementById("comic-container");

  if (!comicKey || !chapter) return;

  /* DEVICE CHECK */
  function isOldDevice() {
    const ua = navigator.userAgent || "";
    const oldAndroid = /Android [0-8]\./i.test(ua);

    let slowCPU = false;
    const t0 = performance.now();
    for (let i = 0; i < 40000; i++) {}
    if (performance.now() - t0 > 10) slowCPU = true;

    let badCanvas = false;
    try { if (!document.createElement("canvas").getContext("2d")) badCanvas = true; }
    catch { badCanvas = true; }

    return oldAndroid || slowCPU || badCanvas;
  }

  const USE_SLICER = !isOldDevice();

  /* SLICER */
  async function sliceImage(src, sliceHeight = 1800) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = src;

      img.onload = () => {
        if (!img.width || !img.height) return reject();

        const slices = [];
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        for (let y = 0; y < img.height; y += sliceHeight) {
          const h = Math.min(sliceHeight, img.height - y);
          canvas.width = img.width;
          canvas.height = h;
          ctx.drawImage(img, 0, y, img.width, h, 0, 0, canvas.width, canvas.height);
          slices.push(canvas.toDataURL("image/jpeg", 0.95));
        }
        resolve(slices);
      };

      img.onerror = reject;
    });
  }

  /* LOAD JSON */
  let data;
  try {
    data = await fetch(`${comicKey}.json`).then(r => r.json());
    if (data.series_icon) document.getElementById("series-img").src = data.series_icon;
    document.getElementById("series-link").href = `index.html?comic=${comicKey}`;
  } catch {
    container.innerHTML = "<p style='color:white;text-align:center;padding:50px;'>Błąd JSON.</p>";
    return;
  }

  const pages = data.chapters[chapter];
  if (!pages) return;

  localStorage.setItem(`read_${comicKey}_${chapter}`, "1");

  /* LAZY OBSERVER */
  const lazyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const img = entry.target;
      if (entry.isIntersecting && img.dataset.src) {
        img.src = img.dataset.src;
        img.dataset.src = "";
        img.style.opacity = "1";
        const loading = document.getElementById("chapter_loading");
        if (loading) loading.remove();
      }
    });
  }, { rootMargin: "1200px 0px" });

  /* INSERT IMAGES — FIRST SLICE IMMEDIATE */
  let firstSlice = true;

  for (const src of pages) {
    try {
      if (USE_SLICER) {
        const slices = await sliceImage(src);
        for (const s of slices) {
          const img = document.createElement("img");
          img.className = "comic-page";

          if (firstSlice) {
            img.src = s;
            img.style.opacity = "1";
            firstSlice = false;
          } else {
            img.dataset.src = s;
            img.loading = "lazy";
            lazyObserver.observe(img);
          }

          container.appendChild(img);
        }
      } else {
        const img = document.createElement("img");
        img.className = "comic-page";

        if (firstSlice) {
          img.src = src;
          img.style.opacity = "1";
          firstSlice = false;
        } else {
          img.dataset.src = src;
          img.loading = "lazy";
          lazyObserver.observe(img);
        }

        container.appendChild(img);
      }
    } catch {
      container.innerHTML += "<p style='color:red;text-align:center;'>Błąd obrazu.</p>";
    }
  }

  /* SORT CHAPTERS */
  const keys = Object.keys(data.chapters).sort((a, b) => {
    const na = parseInt(a), nb = parseInt(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb || a.localeCompare(b);
    if (!isNaN(na)) return -1;
    if (!isNaN(nb)) return 1;
    return a.localeCompare(b);
  });

  const index = keys.indexOf(chapter);

  /* BUTTONS */
  nextBtn.onclick = () =>
    location.href = index < keys.length - 1
      ? `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index + 1])}`
      : "https://diligentin.github.io/tlumaczenia/";

  prevBtn.onclick = () =>
    location.href = index > 0
      ? `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index - 1])}`
      : "https://diligentin.github.io/tlumaczenia/";

  homeBtn.onclick = () => location.href = "https://diligentin.github.io/tlumaczenia/";

  /* PADLET */
  let padletLoaded = false;

  function loadPadlet() {
    if (padletLoaded) return;
    padletLoaded = true;

    const loading = document.getElementById("padlet_loading");
    if (loading) loading.remove();

    document.getElementById("comments_title").style.opacity = "1";

    const box = document.getElementById("padlet_box");
    const embed = data.padlet;
    const full = embed.replace("/embed/", "/");

    box.innerHTML = `
      <div style="border:1px solid #0001; border-radius:2px; overflow:hidden; max-width:720px; margin:0 auto;">
        <iframe src="${embed}" frameborder="0" style="width:100%;height:600px;"></iframe>
        <p style="text-align:center; margin-top:14px;">
          <a href="${full}" target="_blank"
             style="padding:10px 18px; background:#272727; color:white; font-family:figtree; font-size:14px; border-radius:3px; text-decoration:none;">
            Otwórz padlet w nowej karcie
          </a>
        </p>
      </div>
    `;

    box.style.visibility = "visible";
    box.style.opacity = "1";
  }

  const padletEl = document.getElementById("padlet_box");
  new IntersectionObserver(e => e[0].isIntersecting && loadPadlet(), { threshold: 0.1 })
    .observe(padletEl);

  window.addEventListener("scroll", function reveal() {
    if (window.scrollY > 250) {
      padletEl.style.visibility = "visible";
      padletEl.style.opacity = "1";
      window.removeEventListener("scroll", reveal);
    }
  });

  /* NAV HIDE — OLD, INSTANT VERSION */
  const nav = document.getElementById("nav");
  const header = document.getElementById("series-header");
  let lastScroll = 0;

  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    if (y > lastScroll) {
      nav.classList.add("hidden");
      header.style.opacity = "0";
    } else {
      nav.classList.remove("hidden");
      header.style.opacity = "1";
    }
    lastScroll = y;
  });

})();
</script>

</body>
</html>
