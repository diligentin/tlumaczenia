<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✦⏖✦ą</title>
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">

<style>
@font-face{font-family:"figtree";src:url("https://tajnachalupka.github.io/main/Figtree.ttf") format("truetype");}
body{margin:0;background:#191818;font-family:figtree,sans-serif;}
#comic-container{max-width:720px;margin:0 auto;}
img.comic-page{width:100%;display:block;max-width:720px;image-rendering:-webkit-optimize-contrast;object-fit:contain;}

.nav-buttons{position:fixed;bottom:20px;left:20px;display:flex;flex-direction:column;gap:6;transition:opacity .15s;}
.nav-buttons.hidden{opacity:0;pointer-events:none;}
.nav-btn{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.btn-icon{width:30px;height:30px;filter:invert(1);}
</style>
</head>

<body>

<div id="comic-container"></div>
<p id="chapter_loading" style="margin-top:88px;color:white;text-align:center;">Ładuję rozdział...</p>

<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="nextBtn"><img src="https://tajnachalupka.github.io/main/szczala-next.png" class="btn-icon"></div>
  <div class="nav-btn" id="prevBtn"><img src="https://tajnachalupka.github.io/main/szczala-prev.png" class="btn-icon"></div>
  <div class="nav-btn" id="homeBtn"><img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon"></div>
</div>

<script>
(async function(){

const qs=new URLSearchParams(location.search);
const comicKey=qs.get("comic");
const chapter=qs.get("chapter");
const container=document.getElementById("comic-container");

let data=await (await fetch(`${comicKey}.json`)).json();
const pages=data.chapters[chapter];

let index=0;

async function loadNext(){
  if(index>=pages.length)return;

  const src=pages[index];
  index++;

  const img=document.createElement("img");
  img.className="comic-page";
  img.dataset.src=src;
  img.dataset.retry="0";
  img.src="";

  img.onload=()=>document.getElementById("chapter_loading")?.remove();

  img.onerror=()=>{
    let t=+img.dataset.retry;
    if(t<3){
      img.dataset.retry=t+1;
      img.src=img.dataset.src+"?r="+Date.now();
    }
  };

  container.appendChild(img);

  const obs=new IntersectionObserver(e=>{
    if(e[0].isIntersecting){
      img.src=img.dataset.src;
      obs.disconnect();
    }
  });
  obs.observe(img);

  const endObs=new IntersectionObserver(e=>{
    if(e[0].isIntersecting){
      endObs.disconnect();
      loadNext();
    }
  },{rootMargin:"0px 0px -80% 0px"});
  endObs.observe(img);
}

loadNext();

const keys=Object.keys(data.chapters).sort((a,b)=>{
  const na=+a,nb=+b,ha=!isNaN(na),hb=!isNaN(nb);
  if(ha&&hb)return na-nb||a.localeCompare(b);
  if(ha)return -1;
  if(hb)return 1;
  return a.localeCompare(b);
});

const idx=keys.indexOf(chapter);

document.getElementById("nextBtn").onclick=()=>{
  location.href=idx<keys.length-1
    ? `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[idx+1])}`
    : "https://tajnachalupka.wixsite.com/tlumaczenia";
};

document.getElementById("prevBtn").onclick=()=>{
  location.href=idx>0
    ? `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[idx-1])}`
    : "https://tajnachalupka.wixsite.com/tlumaczenia";
};

document.getElementById("homeBtn").onclick=()=>{
  location.href="https://tajnachalupka.wixsite.com/tlumaczenia";
};

})();
</script>

</body>
</html>
