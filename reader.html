<!DOCTYPE html>
<html lang="pl">
<head>
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>czytnik</title>

<style>
@font-face {
  font-family: "piekos";
  src: url("https://tajnachalupka.github.io/main/Piekos.otf") format("opentype");
  font-weight: 300;
}

body {
  margin: 0;
  background: #191818ff;
}

#comic-container {
  max-width: 720px;
  margin: 0 auto;
}

/* obrazki */
img {
  width: 100%;
  height: auto;
  display: block;
  max-width: 720px;
  aspect-ratio: auto;
  image-rendering: -webkit-optimize-contrast;
  object-fit: contain;
}

@media (max-width: 800px) {
  img {
    max-width: 100% !important;
    margin: 0;
  }
}

/* ===== FLOATING BUTTONS ===== */
.nav-buttons {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: opacity 0.3s ease;
  opacity: 1;
}

.nav-buttons.hidden {
  opacity: 0;
  pointer-events: none;
}

.nav-btn {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: 0.2s;
}

.btn-icon {
  width: 42px;
  height: 42px;
  pointer-events: none;
  filter: invert(1);
}

/* ===== REACTIONS ===== */
#reactions {
  padding: 25px 10px 15px;
  text-align: center;
  color: white;
}

.reaction-row {
  display: flex;
  justify-content: center;
  gap: 2px;
  flex-wrap: nowrap;
}

.react img {
  width: 80px;
  height: 80px;
  object-fit: contain;
  border-radius: 2px;
  flex-shrink: 0;
  min-width: 60px;
  min-height: 60px;
  max-width: 16vw;
  max-height: 16vw;
}

.react {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.15s ease;
  border-radius: 2px;
}

.react .count {
  margin-top: 4px;
  font-size: 14px;
  color: #ddd;
}

.react.clicked {
  animation: pulse 0.35s ease;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

/* ===== DISQUS ===== */
#disqus_thread {
  padding: 20px;
  background: #111;
  margin-top: 40px;
}
</style>
</head>

<body>

<div id="comic-container"></div>

<!-- ===== FLOATING BUTTONS ===== -->
<div class="nav-buttons" id="nav">

  <div class="nav-btn" id="nextBtn">
    <img src="https://tajnachalupka.github.io/main/szczala-next.png" class="btn-icon">
  </div>
  
  <div class="nav-btn" id="prevBtn">
    <img src="https://tajnachalupka.github.io/main/szczala-prev.png" class="btn-icon">
  </div>

  <div class="nav-btn" id="homeBtn">
    <img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon">
  </div>
</div>

<!-- ===== REACTIONS ===== -->
<div id="reactions">
  <div class="reaction-row">

    <div class="react" data-id="1">
      <img src="https://tajnachalupka.github.io/main/guziki-reakcji/r1.jpg">
      <div class="count">0</div>
    </div>

    <div class="react" data-id="2">
      <img src="https://tajnachalupka.github.io/main/guziki-reakcji/r2.jpg">
      <div class="count">0</div>
    </div>

    <div class="react" data-id="3">
      <img src="https://tajnachalupka.github.io/main/guziki-reakcji/r3.jpg">
      <div class="count">0</div>
    </div>

    <div class="react" data-id="4">
      <img src="https://tajnachalupka.github.io/main/guziki-reakcji/r4.jpg">
      <div class="count">0</div>
    </div>

    <div class="react" data-id="5">
      <img src="https://tajnachalupka.github.io/main/guziki-reakcji/r5.jpg">
      <div class="count">0</div>
    </div>

  </div>
</div>

<!-- ===== DISQUS ===== -->
<div id="disqus_thread"></div>

<script>
(async function () {

  const params = new URLSearchParams(window.location.search);
  const comicKey = params.get("comic");
  const chapter = params.get("chapter");

  const container = document.getElementById("comic-container");

  document.getElementById("homeBtn").onclick = () => {
    window.location.href = "https://diligentin.github.io/tlumaczenia/";
  };

  if (!comicKey || !chapter) {
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Brak parametru comic lub chapter.</p>";
    return;
  }

  /* ===== CIĘCIE OBRAZÓW (NAPRAWIONE) ===== */
  async function sliceImage(src, sliceHeight = 2000) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = src;

      img.onload = () => {
        try {
          const slices = [];

          const scale = img.width > 720 ? 720 / img.width : 1;

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          for (let y = 0; y < img.height; y += sliceHeight) {
            const h = Math.min(sliceHeight, img.height - y);

            canvas.width = img.width * scale;
            canvas.height = h * scale;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(
              img,
              0, y, img.width, h,
              0, 0, canvas.width, canvas.height
            );

            slices.push({
              url: canvas.toDataURL("image/jpeg", 0.95)
            });
          }

          resolve(slices);
        } catch (e) {
          reject(e);
        }
      };

      img.onerror = () => reject();
    });
  }

  /* ===== ŁADOWANIE JSON ===== */
  let data;
  try {
    const res = await fetch(`${comicKey}.json`);
    data = await res.json();
  } catch {
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Błąd wczytywania pliku JSON.</p>";
    return;
  }

  const pages = data.chapters[chapter];

  if (!pages) {
    container.innerHTML =
      "<p style='color:white;text-align:center;padding:50px;'>Ten rozdział nie istnieje.</p>";
    return;
  }

  /* ===== ZAPIS HISTORII ===== */
  localStorage.setItem(`read_${comicKey}_${chapter}`, "1");

  /* ===== ŁADOWANIE ===== */
  const loadingInfo = document.createElement("p");
  loadingInfo.style.color = "white";
  loadingInfo.style.textAlign = "center";
  loadingInfo.style.padding = "24px";
  loadingInfo.style.fontFamily = "piekos, sans-serif";
  loadingInfo.textContent = "Ładowanie rozdziału...";
  container.appendChild(loadingInfo);

  /* ===== WYCINANIE I WSTAWIANIE ===== */
  for (const src of pages) {
    try {
      const slices = await sliceImage(src, 2000);
      slices.forEach(slice => {
        const img = document.createElement("img");
        img.src = slice.url;
        img.loading = "lazy";
        container.appendChild(img);
      });
    } catch {
      const errP = document.createElement("p");
      errP.style.color = "red";
      errP.style.textAlign = "center";
      errP.style.padding = "10px";
      errP.textContent = "Błąd ładowania strony.";
      container.appendChild(errP);
    }
  }

  loadingInfo.remove();

  /* ===== SORTOWANIE KLUCZY ===== */
  const keys = Object.keys(data.chapters).sort((a, b) => {
    const na = parseInt(a);
    const nb = parseInt(b);
    const ha = !isNaN(na);
    const hb = !isNaN(nb);

    if (ha && hb) {
      if (na !== nb) return na - nb;
      return a.localeCompare(b);
    }
    if (ha) return -1;
    if (hb) return 1;
    return a.localeCompare(b);
  });

  const index = keys.indexOf(chapter);

  /* ===== NEXT ===== */
  document.getElementById("nextBtn").onclick = () => {
    if (index !== -1 && index < keys.length - 1) {
      window.location.href =
        `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index + 1])}`;
    } else {
      window.location.href = "https://diligentin.github.io/tlumaczenia/";
    }
  };

  /* ===== PREV ===== */
  document.getElementById("prevBtn").onclick = () => {
    if (index > 0) {
      window.location.href =
        `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index - 1])}`;
    } else {
      window.location.href = "https://diligentin.github.io/tlumaczenia/";
    }
  };

})();
  
/* ===== AUTO-HIDE BUTTONS ===== */
let lastScroll = 0;
const nav = document.getElementById("nav");

window.addEventListener("scroll", () => {
  const current = window.scrollY;
  if (current > lastScroll) nav.classList.add("hidden");
  else nav.classList.remove("hidden");
  lastScroll = current;
});

/* ===== REACTIONS ===== */
document.querySelectorAll(".react").forEach(btn => {
  btn.addEventListener("click", () => {
    const id = btn.dataset.id;

    const key = `react_${comicKey}_${chapter}_${id}`;
    if (localStorage.getItem(key)) return;

    localStorage.setItem(key, "1");

    btn.classList.add("clicked");

    const count = btn.querySelector(".count");
    count.textContent = parseInt(count.textContent) + 1;

    setTimeout(() => btn.classList.remove("clicked"), 250);
  });
});

/* ===== DISQUS MAPA ===== */
const disqusMap = {
  "afos:2": "https://tajnachalupka.wixsite.com/ub-1/ub25",
  "afos:2♡": "https://tajnachalupka.wixsite.com/ub-1/ub24"
};

var disqus_config = function () {
  const key = `${comicKey}:${chapter}`;
  const mapped = disqusMap[key];

  this.page.url = window.location.href;
  this.page.identifier = mapped || `${comicKey}-${chapter}`;
};

/* ===== DISQUS LAZY LOAD ===== */
let disqusLoaded = false;

function loadDisqus() {
  if (disqusLoaded) return;
  disqusLoaded = true;

  var d = document, s = d.createElement('script');
  s.src = 'https://chalupka-ruoye-chan-wix.disqus.com/embed.js';
  s.setAttribute('data-timestamp', +new Date());
  (d.head || d.body).appendChild(s);
}

const observerDisqus = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadDisqus();
}, { threshold: 0.1 });

observerDisqus.observe(document.getElementById("disqus_thread"));
</script>

</body>
</html>
