<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">

<title>Reader</title>

<style>
@font-face {
  font-family: "figtree";
  src: url("https://tajnachalupka.github.io/main/Figtree.ttf");
}

body {
  margin: 0;
  background: #191818;
}

#comic-container {
  max-width: 720px;
  margin: 0 auto;
}

img.comic-page {
  width: 100%;
  height: auto;
  display: block;
  opacity: 0;
  transition: opacity .35s ease;
}

/* ===== FLOATING BUTTONS ===== */
.nav-buttons {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  flex-direction: column;
  gap: 0px;
  transition: opacity .2s;
}

.nav-btn {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.btn-icon {
  width: 42px;
  height: 42px;
  filter: invert(1);
}

/* ===== REACTIONS ===== */
#reactions {
  padding: 25px 10px 15px;
  text-align: center;
  color: white;
  visibility: hidden;
  opacity: 0;
  transition: opacity .3s ease;
}

.reaction-row {
  display: flex;
  justify-content: center;
  gap: 2px;
}

.react img {
  width: 80px;
  height: 80px;
  object-fit: contain;
}

.react {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
}

.react .count {
  margin-top: 4px;
  font-size: 14px;
  color: #ddd;
}

/* ===== DISQUS ===== */
#disqus_thread {
  padding: 20px;
  background: #111;
  margin-top: 40px;
  visibility: hidden;
  opacity: 0;
  transition: opacity .3s ease;
}

#disqus_loading {
  color: white;
  text-align: center;
  font-family: figtree;
  padding: 20px;
}
</style>
</head>

<body>

<div id="comic-container"></div>

<!-- BUTTONS -->
<div class="nav-buttons" id="nav">
  <div class="nav-btn" id="nextBtn"><img src="https://tajnachalupka.github.io/main/szczala-next.png" class="btn-icon"></div>
  <div class="nav-btn" id="prevBtn"><img src="https://tajnachalupka.github.io/main/szczala-prev.png" class="btn-icon"></div>
  <div class="nav-btn" id="homeBtn"><img src="https://tajnachalupka.github.io/main/domek.png" class="btn-icon"></div>
</div>

<!-- REACTIONS -->
<div id="reactions">
  <div class="reaction-row">
    <div class="react" data-id="1"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r1.jpg"><div class="count">0</div></div>
    <div class="react" data-id="2"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r2.jpg"><div class="count">0</div></div>
    <div class="react" data-id="3"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r3.jpg"><div class="count">0</div></div>
    <div class="react" data-id="4"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r4.jpg"><div class="count">0</div></div>
    <div class="react" data-id="5"><img src="https://tajnachalupka.github.io/main/guziki-reakcji/r5.jpg"><div class="count">0</div></div>
  </div>
</div>

<p id="disqus_loading">Ładuję komentarze...</p>
<div id="disqus_thread"></div>

<script>
(async function () {

  const params = new URLSearchParams(location.search);
  const comicKey = params.get("comic");
  const chapter = params.get("chapter");
  const container = document.getElementById("comic-container");

  if (!comicKey || !chapter) return;

  /* ===== FALLBACK ===== */
  function isOldDevice() {
    const ua = navigator.userAgent || "";
    const oldAndroid = /Android [0-8]\./i.test(ua);

    let slowCPU = false;
    const t0 = performance.now();
    for (let i = 0; i < 40000; i++) {}
    if (performance.now() - t0 > 10) slowCPU = true;

    let badCanvas = false;
    try {
      const c = document.createElement("canvas");
      if (!c.getContext("2d")) badCanvas = true;
    } catch { badCanvas = true; }

    return oldAndroid || slowCPU || badCanvas;
  }

  const USE_SLICER = !isOldDevice();

  /* ===== SLICER ===== */
  async function sliceImage(src, sliceHeight = 1800) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = src;

      img.onload = () => {
        const slices = [];
        const scale = 720 / img.width;
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        for (let y = 0; y < img.height; y += sliceHeight) {
          const h = Math.min(sliceHeight, img.height - y);
          canvas.width = 720;
          canvas.height = h * scale;
          ctx.drawImage(img, 0, y, img.width, h, 0, 0, canvas.width, canvas.height);
          slices.push(canvas.toDataURL("image/jpeg", 0.9));
        }
        resolve(slices);
      };

      img.onerror = reject;
    });
  }

  /* ===== JSON ===== */
  let data;
  try {
    data = await fetch(`${comicKey}.json`).then(r => r.json());
  } catch {
    container.innerHTML = "<p style='color:white;text-align:center;padding:50px;'>Błąd JSON.</p>";
    return;
  }

  const pages = data.chapters[chapter];
  if (!pages) return;

  localStorage.setItem(`read_${comicKey}_${chapter}`, "1");

  /* ===== LAZY + FADE-IN ===== */
  const lazyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const img = entry.target;
      if (entry.isIntersecting) {
        if (img.dataset.src) {
          img.src = img.dataset.src;
          img.dataset.src = "";
        }
        img.style.opacity = "1";
      }
    });
  }, { rootMargin: "1200px 0px" });

  /* ===== WSTAWIANIE OBRAZÓW ===== */
  for (const src of pages) {
    try {
      if (USE_SLICER) {
        const slices = await sliceImage(src);
        for (const s of slices) {
          const img = document.createElement("img");
          img.className = "comic-page";
          img.dataset.src = s;
          img.loading = "lazy";
          img.decoding = "async";
          container.appendChild(img);
          lazyObserver.observe(img);
        }
      } else {
        const img = document.createElement("img");
        img.className = "comic-page";
        img.dataset.src = src;
        img.loading = "lazy";
        img.decoding = "async";
        container.appendChild(img);
        lazyObserver.observe(img);
      }
    } catch {
      container.innerHTML += "<p style='color:red;text-align:center;'>Błąd obrazu.</p>";
    }
  }

  /* ===== SORTOWANIE ===== */
  const keys = Object.keys(data.chapters).sort((a, b) => {
    const na = parseInt(a), nb = parseInt(b);
    const ha = !isNaN(na), hb = !isNaN(nb);
    if (ha && hb) return na - nb || a.localeCompare(b);
    if (ha) return -1;
    if (hb) return 1;
    return a.localeCompare(b);
  });

  const index = keys.indexOf(chapter);

  /* ===== BUTTONS ===== */
  nextBtn.onclick = () => {
    if (index < keys.length - 1)
      location.href = `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index + 1])}`;
    else location.href = "https://diligentin.github.io/tlumaczenia/";
  };

  prevBtn.onclick = () => {
    if (index > 0)
      location.href = `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(keys[index - 1])}`;
    else location.href = "https://diligentin.github.io/tlumaczenia/";
  };

  homeBtn.onclick = () => location.href = "https://diligentin.github.io/tlumaczenia/";

  /* ===== REACTIONS ===== */
  document.querySelectorAll(".react").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const key = `react_${comicKey}_${chapter}_${id}`;
      if (localStorage.getItem(key)) return;
      localStorage.setItem(key, "1");
      const count = btn.querySelector(".count");
      count.textContent = parseInt(count.textContent) + 1;
    };
  });

  /* ===== DISQUS ===== */
  const disqusMap = {
    "afos:2": "https://tajnachalupka.wixsite.com/ub-1/ub25",
    "afos:2♡": "https://tajnachalupka.wixsite.com/ub-1/ub24"
  };

  var disqus_config = function () {
    const key = `${comicKey}:${chapter}`;
    this.page.url = location.href;
    this.page.identifier = disqusMap[key] || `${comicKey}-${chapter}`;
  };

  let disqusLoaded = false;

  function loadDisqus() {
    if (disqusLoaded) return;
    disqusLoaded = true;

    const loadingMsg = document.getElementById("disqus_loading");
    if (loadingMsg) loadingMsg.remove();

    var d = document, s = d.createElement('script');
    s.src = 'https://chalupka-ruoye-chan-wix.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
  }

  const disqusEl = document.getElementById("disqus_thread");
  const reactionsEl = document.getElementById("reactions");

  const observerDisqus = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) loadDisqus();
  });
  observerDisqus.observe(disqusEl);

  /* ===== POKAŻ REAKCJE + DISQUS PO 250 PX ===== */
  function revealExtras() {
    if (window.scrollY > 250) {
      reactionsEl.style.visibility = "visible";
      reactionsEl.style.opacity = "1";
      disqusEl.style.visibility = "visible";
      disqusEl.style.opacity = "1";
      window.removeEventListener("scroll", revealExtras);
    }
  }

  window.addEventListener("scroll", revealExtras);

  setTimeout(() => {
    if (window.scrollY > 250) revealExtras();
  }, 50);

})();
</script>

</body>
</html>
