<!DOCTYPE html>
<html lang="pl">
<head>
<link rel="icon" type="image/png" href="https://tajnachalupka.github.io/main/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title id="page-title">loading...</title>

<style>

@font-face {
font-family: "figtree";
  src: url("https://tajnachalupka.github.io/main/Figtree.ttf") format("truetype");
}

@font-face {
  font-family: "piekos";
  src: url("https://tajnachalupka.github.io/main/Piekos.otf") format("opentype");
  font-weight: 300;
}
 
  @font-face {
  font-family: "satoshi";
  src: url("https://tajnachalupka.github.io/main/Satoshi.otf") format("opentype");
  font-weight: 300;
  font-style: normal;
   }
  
/* ===== RESET / BAZA ===== */
body {
  margin: 0;
  background: #191818ff;
  color: white;
  font-family: figtree;
}
a { color: white; text-decoration: none; }

/* HOME BUTTON */
.back {
  display: block;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 20;
  opacity: 0.9;
  transition: opacity .2s ease;
}

.back:hover {
  opacity: 1;
}
.back img {
  width: 40px;
  height: auto;
}

/* ===== UKŁAD ===== */
.comic-layout {
  display: flex;
  gap: 32px;
  padding: 40px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}

.cover {
  width: 100%;
  max-width: 299px;
  border-radius: 2px;
}

.comic-info {
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: center;
}

.comic-header-img {
  display: block;
  width: 100%;
  max-width: 600px;
  margin: 0 auto 13px auto;
  height: auto;
}

/* OPIS */
.comic-desc {
  font-size: 17px;
  color: #e0e0e0;
  line-height: 1.3;
  text-align: justify;
}

/* ===== SEKCJA ===== */
.section { padding: 24px 16px; }
.section h2 { font-size: 30px; font-weight: 200; text-align: center; margin-bottom: 50px; }

/* ===== SIATKA ROZDZIAŁÓW ===== */
.chapter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, 45px);
  gap: 11px;
  align-items: center;
  justify-content: center;
  padding-bottom: 40px;
  margin-bottom: 33px;
  max-width: 600px;
  margin: 0 auto;
}

@media (max-width: 600px) {
  .chapter-grid {
    grid-template-columns: repeat(auto-fit, 45px);
  }
}

.chapter-btn {
  width: 45px;
  height: 45px;
  background: #272727ff;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 200;
  transition: 0.2s;
}

.chapter-btn:hover {
  background: #2a2a2a;
}

.chapter-btn.visited {
  background: #272727ff;
  color: #8394F4;
}

@media (max-width: 600px) {
  body { zoom: 0.9; }
  .comic-header-img {
    width: 120%;
    max-width: none;
    transform: translateX(-10%);
  }
}
</style>
</head>

<body>

<!-- HOME BUTTON -->
<a class="back" href="https://diligentin.github.io/tlumaczenia/">
  <img src="https://tajnachalupka.github.io/main/domek.png">
</a>

<!-- UKŁAD -->
<div class="comic-layout">
  <img class="cover" id="cover" src="" alt="">
  <div class="comic-info">
    <img id="header-img" class="comic-header-img" src="" alt="">
    <p class="comic-desc" id="desc"></p>
  </div>
</div>

<!-- ROZDZIAŁY -->
<div class="section">
  <h2>Rozdziały</h2>
  <div id="chapters"></div>
</div>

<script>
(async function() {

  const params = new URLSearchParams(location.search);
  const comicKey = params.get("title");

  if (!comicKey) {
    document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Brak parametru ?title=</p>";
    return;
  }

  const data = await fetch(`${comicKey}.json`).then(r => r.json());

  document.getElementById("page-title").textContent = data.title || comicKey;
  document.getElementById("cover").src = data.cover;
  document.getElementById("header-img").src = data.header_img;
  document.getElementById("desc").innerHTML = data.desc.replace(/\n/g, "<br>");

  /* ===== MAPA SEZONÓW / TOMÓW ===== */
  const segmentMap = {
    "afos": [
      { title: "Sezon 1", start: 1, end: 40 },
      { title: "Sezon 2", start: 41, end: 80 }
    ],

    "at": [
      { title: "Tom 1", start: 1, end: 12 },
      { title: "Tom 2", start: 13, end: 24 }
    ],

    "bn": [],
    "mp": [],
    "mo": [],
    "mnbig": [],
    "1rta": [],
    "osd": [],
    "rc": [],
    "sah": [],
    "ub": [],
    "yiam": []
  };

  const segments = segmentMap[comicKey] || [];

  /* ===== ROZDZIAŁY ===== */
  const chaptersBox = document.getElementById("chapters");
  chaptersBox.innerHTML = "";

  const chapterKeys = Object.keys(data.chapters);

  /* ⭐ POPRAWIONE ROZDZIELANIE ⭐ */
  const numeric = chapterKeys
    .filter(k => /^[0-9]+$/.test(k))   // tylko czyste liczby
    .map(k => parseInt(k))
    .sort((a, b) => a - b);

  const special = chapterKeys
    .filter(k => !/^[0-9]+$/.test(k))  // wszystko inne
    .sort();

  /* ===== BRAK SEGMENTÓW ===== */
  if (segments.length === 0) {
    const grid = document.createElement("div");
    grid.className = "chapter-grid";

    [...numeric.map(n => n.toString()), ...special].forEach(num => {
      const a = document.createElement("a");
      a.href = `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(num)}`;

      const btn = document.createElement("div");
      btn.className = "chapter-btn";
      btn.innerText = num;

      if (localStorage.getItem(`read_${comicKey}_${num}`) === "1") {
        btn.classList.add("visited");
      }

      a.appendChild(btn);
      grid.appendChild(a);
    });

    chaptersBox.appendChild(grid);
  }

  /* ===== SĄ SEGMENTY ===== */
  else {
    segments.forEach(seg => {

      const h = document.createElement("h3");
      h.textContent = seg.title;
      h.style.textAlign = "center";
      h.style.marginTop = "30px";
      h.style.marginBottom = "15px";
      chaptersBox.appendChild(h);

      const grid = document.createElement("div");
      grid.className = "chapter-grid";

      numeric
        .filter(n => n >= seg.start && n <= seg.end)
        .forEach(n => {
          const num = n.toString();
          const a = document.createElement("a");
          a.href = `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(num)}`;

          const btn = document.createElement("div");
          btn.className = "chapter-btn";
          btn.innerText = num;

          if (localStorage.getItem(`read_${comicKey}_${num}`) === "1") {
            btn.classList.add("visited");
          }

          a.appendChild(btn);
          grid.appendChild(a);
        });

      chaptersBox.appendChild(grid);
    });

    /* ===== SPECJALNE ===== */
    if (special.length > 0) {
      const h = document.createElement("h3");
      h.textContent = "Specjalne";
      h.style.textAlign = "center";
      h.style.marginTop = "30px";
      h.style.marginBottom = "15px";
      chaptersBox.appendChild(h);

      const grid = document.createElement("div");
      grid.className = "chapter-grid";

      special.forEach(num => {
        const a = document.createElement("a");
        a.href = `reader.html?comic=${comicKey}&chapter=${encodeURIComponent(num)}`;

        const btn = document.createElement("div");
        btn.className = "chapter-btn";
        btn.innerText = num;

        if (localStorage.getItem(`read_${comicKey}_${num}`) === "1") {
          btn.classList.add("visited");
        }

        a.appendChild(btn);
        grid.appendChild(a);
      });

      chaptersBox.appendChild(grid);
    }
  }

})();
</script>

</body>
</html>
