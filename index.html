body { margin:0; background:#191818; color:white; font-family: figtree, sans-serif;}

.hero { display:flex; justify-content:center; padding:15px 0; }
.hero img { width:160px; }

.section-block { width:min(100%,1000px); margin:0 auto; padding:0 9px; box-sizing:border-box;}

.section-title-img { display:block; width:100%; max-width:200px; margin:35px 0 20px 0;}

.auto-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:9px; justify-items:center; width:100%; margin:0 auto;}
.auto-grid1 { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; justify-items:center; width:100%; margin:0 auto;}
.auto-grid1a { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; justify-items:center; width:100%; margin:0 auto;}
.auto-grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:5px; }
  
.card { text-decoration:none; color:white; text-align:center; }
.card img { transition: filter .25s ease;}
.card:hover img { transform: none; filter: brightness(0.8);}


.card.square img { width:100%; max-width:150px; border-radius:2px; aspect-ratio:1/1; object-fit:cover;}

.card.tall img { width:100%; max-width:180px; aspect-ratio:5/9; object-fit:cover;}

.card.title img { width: 100%; max-width: 222px; height: auto; object-fit: contain;}

@media(max-width:600px){
  .auto-grid { grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:5px; }
  .auto-grid1 { grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:13px; }
  .auto-grid1a { grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:13px; }
  .auto-grid2 { grid-template-columns:repeat(2,1fr); gap:58px; margin-bottom:13px; }
  .section-title-img { width:58%; }
}
</style>

<div style="text-align:center; margin:40px 0;">

       style="max-width:470px; width:100%; height:auto;">
</div>

<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) card.classList.add("read");
  }
});
</script>
