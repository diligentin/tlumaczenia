<style>

   @font-face {
  font-family: "figtree";

  @font-face {

body {
  margin:0;
  background:#191818ff;
  color:white;
  font-family: figtree, sans-serif;
}

.hero {
  display:flex;
  justify-content:center;
  padding: 15px 0;
}
.hero img { width:160px; }

.section-block {
  width:min(100%,1000px);
  margin:0 auto;
  padding:0 9px;
  box-sizing:border-box;
}

.section-title-img {
  display:block;
  width:100%;
  max-width:200px;
  margin:35px 0 20px 0;
  height:auto;
}

.auto-grid {
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:9px;
  justify-items:center;
  width:fit-content;
  margin-left:auto;
  margin-right:auto;
}

#titles-grid-1 { margin-bottom:13px; }
#titles-grid-2 { margin-bottom:30px; }

.card {
  text-decoration:none;
  color:white;
  text-align:center;
}

.card img {
  transition:transform .25s ease, border-radius .25s ease;
}

.card:hover img { transform:scale(1.03); }

.card.square img {
  width:100%;
  max-width:150px;
  height:auto;
  border-radius:2px;
  aspect-ratio:1/1;
  object-fit:cover;
}

.card.tall img {
  width:100%;
  max-width:150px;
  height:auto;
  border-radius:2px;
  aspect-ratio:5/9;
  object-fit:cover;
}

@media(max-width:600px){
  .auto-grid {
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:9px;
  }
  .card img { width:100%; height:auto; }
  .section-title-img { width:58%; height:auto; }
}

</style>
</head>

<!-- PADLET USUNIĘTY -->

<script>
document.querySelectorAll("a.card").forEach(card => {
  const url = new URL(card.href, window.location.href);
  const comic = url.searchParams.get("comic");
  const chapter = url.searchParams.get("chapter");

  if (comic && chapter) {
    const key = `read_${comic}_${chapter}`;
    if (localStorage.getItem(key)) {
      card.classList.add("read");
    }
  }
});
</script>
